<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <title>Peters Kasse</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #f1f3f6;
        color: #171717;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 20px;
      }

      main {
        background: #ffffff;
        border: 1px solid #d9dee6;
        border-radius: 8px;
        box-shadow: 0 18px 44px rgba(20, 28, 38, 0.11);
        display: grid;
        gap: 12px;
        max-width: 420px;
        padding: 22px;
        text-align: center;
      }

      h1,
      p {
        margin: 0;
      }

      p {
        color: #6f7580;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Peters Kasse</h1>
      <p>
        Die App-Huelle ist installiert. Verbinde sie per Capacitor-Sync mit dem
        Kassenserver, damit die Live-Kasse geladen wird.
      </p>
    </main>
  </body>
</html>
